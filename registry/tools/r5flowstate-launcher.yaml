  last_checked: "2026-11-20"
  notes:
    - "README: a .NET 8 shell only; it ships no paks, audio or r5apex.exe and installs game content into a separate user-chosen folder."
    - "Installs the R5Flowstate bridge: a Season 21 client (r5apex_dx12.exe) and a Season 3 dedicated server (r5apex_ds.exe), with r5apex_listen_host.dll and r5f-modtool.exe in the local install."
    - "No ARES adapter. The legacy SDK 2.3 r5 harness and its RCON protocol are not evidence for this runtime."
