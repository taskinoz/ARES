description: "R5Flowstate content installer, server browser and process launcher shell for the S21-client/S3-dedicated bridge."
repository: https://github.com/R5Flowstate/launcher
targets: [r5]
categories: [runtime]
capabilities: [runtime-source, content-install]
formats: {inputs: [source], outputs: [runtime]}
