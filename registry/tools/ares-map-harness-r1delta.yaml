id: ares-map-harness-r1delta
name: ARES R1Delta map harness
description: "Loads Titanfall 1 maps in R1Delta through its MCP server; same checks and event lines as the TFO map harness."
repository: https://github.com/taskinoz/ARES
targets: [r1]
categories: [testing, runtime]
capabilities: [runtime-testing, collision-testing, physics-testing, map-testing, screenshots]
formats:
  inputs: [bsp, json, vmt, vtf]
  outputs: [json, png]
integration:
  type: local-adapter
  harness: partially-verified
  agent_instructions: verified
  setup: ares
upstream:
  default_branch: respawn-format-research
  commit: 53fd03029f3e8f0b0b421cedaa6105c1506d9daf
  readme_path: harnesses/docs/r1delta.md
  agents_path: AGENTS.md
  skills_path: .agents/skills/run-harness
  harness_path: harnesses/adapters/r1_harness.py
  license: GPL-2.0-or-later
verification:
  status: partial
  last_checked: "2026-11-18"
  notes:
    - "Two grunt round trips (48 movement samples) and one native atlas goal/return pair (40 samples) pass in both runtimes. Atlas checks native type/bounds and HULL_TITAN connectivity; final arrival facing unspecified. The initial TFO fixed-facing return hold fails and is retained. Piloting, combat, other hulls/maps and full Phase 2 remain open."
    - "Scoped MRVN native AIN export/offline CRC packaging passes original and changed-pillar/node routes in both runtimes. Owned R1/TFO native fields agree with CRC 1916430116. Explicit build_navigation launch flag; no integrity checks disabled. Other hulls/formats, general AI and full release acceptance remain open."
    - "One original eight-node grunt obstacle route reaches/holds the goal in both runtimes with a generated AIN. Shared navigation_probe checks living indexed samples, floor/obstacle poses and arrival. R1 matching graph staging and bounded v54 framing are tested; native CRC/export automation, other hulls and general AI remain open. 151 adapter tests pass."
    - "Natural neutral-point capture/hold passes in the shared original CP fixture: living player in trigger contact, friendly ownership and five team points in both final runs. No state/ownership/score setters. TFO interventions remain explicit. Contested/recapture, other modes and release acceptance remain open; 136 adapter tests pass."
    - "Explicit CP mode and three native hardpoint IDs/terminals, living spawn and floor trace pass in R1Delta and TFO. TFO Core135 requires reported temporary dialogue and supplied sound-definition compatibility repairs; unmodified authored/retail controls fail. No capture/scoring/audio-playback claim. 127 adapter tests pass."
    - "Separate local forward-input control passes one standing flat-floor trigger crossing in each runtime, with 16 alive/non-crouched samples and one enter/exit. Public triggers still use repositioning; broader traversal and navigation remain open."
    - "Initial alive spawn pose and axis-aligned/rotated trigger enter/exit counts pass in both runtimes. Native atlas NPC flat-floor support passes five samples using target-specific settings; no piloting, combat, navigation or complete-mode parity claim. 102 adapter tests pass."
    - "One compiled wet/dry cardboard buoyancy probe completed; dry PHY support and sampled translation checks pass. Wet body keeps bobbing despite zero entity velocity; broader buoyancy/rest acceptance remains open."
    - "Native compiled water-room probes record three exact camera origins and alive=true. Material staging and diagnostic unlit surfaces work; native Water surface rendering is restored by the shader VPK pair; underwater horizon artifacts remain, including a retail reference. Death/missing-alive captures are rejected."
    - "ARES adapter run in R1Delta 3.0.5 on an authored v29 brush/patch map: six collision probes match TFO; barrel speed/bounds and four sequential drops pass. Broader gameplay/visual parity is unverified."
inspection:
  checked_at: "2026-11-12T12:30:00Z"
  method: local-tests
  evidence:
    - harnesses/adapters/r1_harness.py
    - harnesses/adapters/test_r1_harness.py
documentation:
  - https://github.com/taskinoz/ARES/blob/main/harnesses/docs/r1delta.md
