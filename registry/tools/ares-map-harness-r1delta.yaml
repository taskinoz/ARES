id: ares-map-harness-r1delta
name: ARES R1Delta map harness
description: "Loads Titanfall 1 maps in R1Delta through its MCP server; same checks and event lines as the TFO map harness."
repository: https://github.com/taskinoz/ARES
targets: [r1]
categories: [testing, runtime]
capabilities: [runtime-testing, collision-testing, physics-testing, map-testing, screenshots]
formats:
  inputs: [bsp, json, vmt, vtf]
  outputs: [json, png]
integration:
  type: local-adapter
  harness: partially-verified
  agent_instructions: verified
  setup: ares
upstream:
  default_branch: respawn-format-research
  commit: 53fd03029f3e8f0b0b421cedaa6105c1506d9daf
  readme_path: harnesses/docs/r1delta.md
  agents_path: AGENTS.md
  skills_path: .agents/skills/run-harness
  harness_path: harnesses/adapters/r1_harness.py
  license: GPL-2.0-or-later
verification:
  status: partial
  last_checked: "2026-11-15"
  notes:
    - "Native compiled water-room probes record three exact camera origins and alive=true. Material staging and diagnostic unlit surfaces work; native Water surface rendering remains unresolved. Death/missing-alive captures are rejected."
    - "ARES adapter run in R1Delta 3.0.5 on an authored v29 brush/patch map: six collision probes match TFO; barrel speed/bounds and four sequential drops pass. Broader gameplay/visual parity is unverified."
inspection:
  checked_at: "2026-11-12T12:30:00Z"
  method: local-tests
  evidence:
    - harnesses/adapters/r1_harness.py
    - harnesses/adapters/test_r1_harness.py
documentation:
  - https://github.com/taskinoz/ARES/blob/main/harnesses/docs/r1delta.md
