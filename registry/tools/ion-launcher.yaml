targets: [r2]
categories: [runtime, reference]
capabilities: [runtime-source, scripting-reference]
formats:
  inputs: [source, northstar-mod]
  outputs: [runtime]
integration: {type: external-repository, harness: unverified, agent_instructions: unverified, setup: upstream}
