name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # the map harness tests use Windows APIs (ctypes.wintypes); the games are Windows-only
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate registry
        run: python scripts/validate-registry.py
      - name: Check the skill mirror
        run: python scripts/sync-agent-skills.py --check
      - name: Test scripts and the ares package
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Test map tools
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Test map harness adapters
        run: python -m unittest discover -s harnesses/adapters -p "test_*.py"
      - name: Test harness recipes
        run: python -m unittest discover -s harnesses/recipes -p "test_*.py"
