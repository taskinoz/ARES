name: links

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links (internal/offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "**/*.md" "**/*.yaml"
